<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- interactive-widget fixes Chrome/Android when the keyboard opens. iOS
     ignores it, so app.js drives --kb from visualViewport instead. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#061419">
<title>Reef</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#061419; --surface:#0C2028; --surface-2:#122c36; --line:#1b3b46;
  --text:#E6F1F4; --muted:#8AA6AF; --accent:#38BFA7; --accent-ink:#04211d;
  --mine:#12524B; --mine-text:#E9FBF7; --theirs:#12262E;
  --danger:#E4685D;
  --kb:0px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100dvh;overflow:hidden;}
body{
  background:var(--bg);color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  overscroll-behavior:none;
}
button,input,textarea{font:inherit;color:inherit;}
/* The PIN boxes space out digits with letter-spacing, and a placeholder is
   part of the same text run — "Choose a PIN" spaced out that wide overflowed
   a box sized for six characters. Placeholder text was never the thing the
   spacing was for. */
input::placeholder{letter-spacing:normal;}
button{background:none;border:0;cursor:pointer;touch-action:manipulation;}
.tap{min-width:48px;min-height:48px;display:flex;align-items:center;justify-content:center;}

#app{height:100dvh;display:flex;flex-direction:column;position:relative;}
.screen{display:none;flex-direction:column;height:100dvh;}
.screen.on{display:flex;}

/* ---------------- Lock ---------------- */
#lock{align-items:center;justify-content:space-between;padding:calc(var(--safe-top) + 8vh) 24px calc(var(--safe-bottom) + 24px);}
.mark{display:flex;flex-direction:column;align-items:center;gap:18px;}
.mark svg{width:64px;height:64px;opacity:.9;}
.dots{display:flex;gap:13px;margin-top:6px;min-height:14px;}
/* Short on purpose. This is the only confirmation that a digit landed, so a
   long fade reads as lag. */
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);transition:transform .06s,background .06s;}
.dot.full{background:var(--accent);border-color:var(--accent);transform:scale(1.12);}
.dots.wrong{animation:shake .4s;}
@keyframes shake{10%,90%{transform:translateX(-5px)}30%,70%{transform:translateX(6px)}50%{transform:translateX(-3px)}}
#lock-note{color:var(--muted);font-size:14px;min-height:20px;text-align:center;}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:320px;}
.key{height:72px;border-radius:20px;background:var(--surface);font-size:26px;font-weight:500;
     display:flex;align-items:center;justify-content:center;transition:background .06s,transform .06s;}
/* .down is set from pointerdown in app.js. :active alone is not enough — iOS
   Safari never applies it to a button, so on an iPhone the pad had no press
   state at all. */
.key:active,.key.down{background:var(--surface-2);transform:scale(.96);}
.key.blank{background:none;}
.key.util{font-size:20px;color:var(--muted);}

/* ---------------- Pending ---------------- */
#pending{align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center;}
#pending h2{margin:0;font-size:20px;font-weight:600;}
#pending p{margin:0;color:var(--muted);max-width:34ch;}

/* ---------------- Pool ---------------- */
#hdr{
  display:flex;align-items:center;gap:12px;
  padding:calc(var(--safe-top) + 8px) 12px 8px;
  background:linear-gradient(#061419,#061419e6);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);flex:0 0 auto;position:relative;z-index:3;
}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--surface-2);
        display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;}
.who{flex:1;min-width:0;}
.who b{display:block;font-size:16px;font-weight:600;line-height:1.2;}
.who span{display:block;font-size:12.5px;color:var(--muted);line-height:1.3;}
.who span.live{color:var(--accent);}

/* A device waiting to be let in used to announce itself with a 2.6s toast and
   nothing else. This stays until it is dealt with. */
.banner{display:none;align-items:center;gap:10px;width:100%;text-align:left;flex:0 0 auto;
        padding:11px 12px;background:#3a1f1c;border-bottom:1px solid var(--danger);
        color:var(--text);font-size:13.5px;z-index:2;}
.banner.on{display:flex;}
.banner .grow{flex:1;}
.banner .go{color:var(--accent);font-weight:600;}

#scroller{
  flex:1;overflow-y:auto;overflow-x:hidden;
  overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;
  padding:8px 10px 4px;
}
#list{display:flex;flex-direction:column;gap:2px;}

.day{align-self:center;margin:14px 0 8px;padding:4px 12px;border-radius:12px;
     background:var(--surface);color:var(--muted);font-size:12px;font-weight:500;}
/* A run of messages this device holds no key for, stated once. */
.sealed{align-self:center;margin:12px 0;padding:5px 12px;border-radius:12px;
        background:var(--surface);border:1px dashed var(--line);
        color:var(--muted);font-size:12px;text-align:center;max-width:80%;}
.newline{align-self:stretch;display:flex;align-items:center;gap:10px;margin:10px 2px;color:var(--accent);font-size:12px;}
.newline:before,.newline:after{content:"";flex:1;height:1px;background:var(--accent);opacity:.35;}

.row{display:flex;width:100%;touch-action:pan-y;}
.row.mine{justify-content:flex-end;}
.row.gap{margin-top:8px;}
.checkbox{width:22px;height:22px;border-radius:50%;flex:0 0 auto;align-self:center;
          margin:0 8px;border:2px solid var(--line);background:var(--surface);}
.checkbox.checked{background:var(--accent);border-color:var(--accent);
                   display:flex;align-items:center;justify-content:center;}
.checkbox.checked::after{content:'✓';color:var(--accent-ink);font-size:13px;font-weight:700;}

.bubble{
  position:relative;max-width:78%;padding:8px 11px 6px;border-radius:var(--radius);
  background:var(--theirs);word-wrap:break-word;overflow-wrap:anywhere;
  -webkit-touch-callout:none;user-select:none;transition:transform .18s cubic-bezier(.2,.8,.3,1);
}
.mine .bubble{background:var(--mine);color:var(--mine-text);}
.row.tail:not(.mine) .bubble{border-bottom-left-radius:6px;}
.row.tail.mine .bubble{border-bottom-right-radius:6px;}
.bubble .txt{white-space:pre-wrap;}
.bubble.jumbo .txt{font-size:40px;line-height:1.2;}
.bubble.jumbo{background:none!important;padding:2px 4px;}

.meta{display:flex;align-items:center;justify-content:flex-end;gap:4px;
      font-size:11px;color:var(--muted);margin-top:2px;}
.mine .meta{color:#9fd8cf;}
.tick{font-size:11px;letter-spacing:-2px;}
.tick.read{color:#7FD5FF;}

/* A button now, so it can carry you to what it quotes — hence the explicit
   width, alignment and font, which a bare <button> would not inherit. */
.quote{display:block;width:100%;text-align:left;font:inherit;cursor:pointer;
       border:0;border-left:3px solid var(--accent);padding:3px 8px;margin-bottom:5px;
       background:#ffffff10;border-radius:8px;font-size:13.5px;color:var(--muted);
       max-height:52px;overflow:hidden;}
.quote:active{background:#ffffff20;}
.bubble.gone .txt{font-style:italic;color:var(--muted);}

/* height:auto is the important one. app.js sets width *and* height attributes
   from the real pixel size so the browser can reserve the right space before
   the blob decrypts — but with max-width shrinking the width to the bubble and
   the height attribute left standing, every image in the thread was stretched
   vertically. object-fit is the backstop for any box that still ends up the
   wrong shape. */
.media{display:block;max-width:100%;height:auto;object-fit:contain;
       border-radius:12px;margin-bottom:4px;background:#0a1a20;}
/* Only for attachments that arrived without dimensions. A blanket min-height
   stretched anything shorter than it. */
.media.sizeless{min-height:120px;}
.media.pending{filter:blur(8px);}
/* Anything that is not a picture or a video: a row that says what it is and
   hands it over on tap, rather than a broken <img>. */
.file{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
      padding:8px 10px;margin-bottom:4px;border-radius:12px;
      background:#ffffff12;color:inherit;cursor:pointer;}
.file .ico{font-size:22px;flex:0 0 auto;}
.file .grow{flex:1;min-width:0;}
.file b{display:block;font-weight:600;font-size:14px;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.file span{display:block;font-size:12px;opacity:.75;}

/* Staged attachments — what is about to go, and a way to change your mind. */
#staged{display:none;gap:6px;margin:2px 4px 6px;padding-bottom:2px;
        overflow-x:auto;overscroll-behavior-x:contain;}
#staged.on{display:flex;}
.stage{position:relative;flex:0 0 auto;display:flex;align-items:center;gap:8px;
       max-width:210px;padding:6px 8px;border-radius:12px;
       background:var(--surface);border:1px solid var(--line);font-size:12.5px;}
.stage img{width:34px;height:34px;border-radius:8px;object-fit:cover;flex:0 0 auto;}
.stage .ico{font-size:20px;flex:0 0 auto;}
.stage .grow{min-width:0;}
.stage b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;
         text-overflow:ellipsis;max-width:110px;}
.stage span{display:block;color:var(--muted);font-size:11.5px;}
.stage .drop{width:26px;height:26px;border-radius:50%;flex:0 0 auto;
             background:var(--surface-2);color:var(--muted);font-size:13px;
             display:flex;align-items:center;justify-content:center;}
/* Hung off the bottom edge of the bubble rather than sitting inside it. In the
   flow they took a line of their own and grew the message, so reacting visibly
   resized what you were reacting to. The rail itself is invisible — each
   reaction carries its own boundary. */
.reacts{position:absolute;bottom:-12px;display:flex;align-items:center;gap:3px;
        cursor:pointer;white-space:nowrap;}
/* One pill per person, so two reactions read as two people rather than as one
   crowd. The border matches the page rather than the pill, which is what reads
   as a cut-out over the bubble edge. */
.react{padding:1px 6px;border-radius:12px;background:var(--surface-2);
       border:2px solid var(--bg);box-shadow:0 1px 4px #0006;
       font-size:13px;line-height:1.5;}
/* Yours, so the same emoji from both of you is still telling you something. */
.react.own{border-color:var(--accent);}
/* On the outer edge of each side, where they cannot cover the tail or the ticks. */
.row:not(.mine) .reacts{left:10px;}
.row.mine .reacts{right:10px;}
/* Room for the overhang, or it lands on the next message. */
.row.reacted{margin-bottom:12px;}

.pill{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 10px);
      background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:600;
      padding:8px 14px;border-radius:20px;box-shadow:0 6px 18px #0008;z-index:4;}

/* ---------------- Composer ---------------- */
#composer{
  flex:0 0 auto;position:relative;
  padding:6px 8px calc(6px + var(--kb) + var(--safe-bottom));
  background:var(--bg);border-top:1px solid var(--line);
  transition:padding-bottom .12s ease-out;
}
#reply-strip{display:none;align-items:center;gap:8px;margin:2px 4px 6px;padding:6px 8px;
             background:var(--surface);border-left:3px solid var(--accent);border-radius:8px;font-size:13.5px;}
#reply-strip .grow{flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#edit-strip{display:none;align-items:center;gap:8px;margin:2px 4px 6px;padding:6px 8px;
            background:var(--surface);border-left:3px solid #E8C36A;border-radius:8px;font-size:13px;color:var(--muted);}
#match-bar{display:none;align-items:center;gap:2px;margin:2px 4px 6px;padding:4px 4px 4px 10px;
           background:var(--surface);border-left:3px solid var(--accent);border-radius:8px;
           font-size:13px;color:var(--muted);}
#match-bar .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#match-bar button{min-width:38px;min-height:38px;font-size:15px;border-radius:9px;}
#match-bar button:disabled{opacity:.3;}
#match-bar button:not(:disabled):active{background:var(--surface-2);}
.inputrow{display:flex;align-items:flex-end;gap:4px;}
#text{
  flex:1;resize:none;border:0;outline:0;background:var(--surface);
  border-radius:20px;padding:11px 14px;max-height:132px;min-height:44px;line-height:1.35;
}
#text::placeholder{color:#5d7d87;}
#send{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
      display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;}
#send:disabled{opacity:.45;}

/* ---------------- Emoji ---------------- */
#emoji{display:none;height:270px;overflow-y:auto;overscroll-behavior:contain;padding:6px 4px;}
#emoji.on{display:block;}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;}
.emoji-grid button{height:42px;font-size:24px;border-radius:10px;}
.emoji-grid button:active{background:var(--surface);}
/* The fish you are wearing, or the reaction already on a message. A background
   alone was too quiet to find in a grid of two dozen, and it was set as an
   inline style so nothing could reliably clear it. */
.emoji-grid button.picked,.quickreacts button.picked{
  background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--accent);}
.emoji-head{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;margin:8px 6px 3px;}

/* ---------------- Sheet ---------------- */
#scrim{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;
       transition:opacity .18s;z-index:8;}
#scrim.on{opacity:1;pointer-events:auto;}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;transform:translateY(102%);
       transition:transform .24s cubic-bezier(.2,.8,.3,1);
       background:var(--surface);border-radius:22px 22px 0 0;
       padding:8px 10px calc(12px + var(--safe-bottom));box-shadow:0 -8px 30px #0009;}
#sheet.on{transform:translateY(0);}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px;}
.quickreacts{display:flex;justify-content:space-around;padding:4px 2px 10px;border-bottom:1px solid var(--line);margin-bottom:6px;}
/* A flex basis rather than a fixed width: six of these fitted any phone, seven
   do not fit a 320px one, and shrinking a little beats spilling off the edge. */
.quickreacts button{font-size:28px;flex:0 1 44px;height:44px;border-radius:50%;}
.quickreacts button:active{background:var(--surface-2);}
/* Seven across has to survive a narrow phone, so this one is allowed to shrink
   and reads as a control rather than as a seventh reaction. */
.quickreacts .more{font-size:22px;color:var(--muted);background:var(--surface-2);}

/* The full catalogue inside a sheet. Uncapped it grows past the top of the
   screen and the last group cannot be reached — the sheet is anchored to the
   bottom, so it is the *start* of the list that disappears. */
.picker{max-height:46dvh;overflow-y:auto;overscroll-behavior:contain;}
.act{display:flex;align-items:center;gap:14px;width:100%;padding:13px 12px;border-radius:12px;font-size:16px;}
.act:active{background:var(--surface-2);}
.act .ico{width:22px;text-align:center;font-size:17px;}
.act.bad{color:var(--danger);}
.sheet-title{padding:2px 12px 10px;color:var(--muted);font-size:13px;}
.act .stack{flex:1;min-width:0;}
.act .stack b{display:block;font-weight:600;}
/* Two people on two iPhones produce two rows both reading "iPhone". The
   second line is what tells them apart. */
.act .stack .sub{display:block;font-size:12px;color:var(--muted);margin-top:1px;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:1.9;
      letter-spacing:.04em;background:var(--bg);padding:12px;border-radius:12px;word-spacing:6px;}

/* ---------------- Search ----------------
   Its own layer rather than a mode of the thread: the results list and the
   conversation want opposite scroll anchoring, and sharing one scroller meant
   whichever ran last decided where the eye ended up. */
#search{position:fixed;inset:0;z-index:12;background:var(--bg);
        display:none;flex-direction:column;}
#search.on{display:flex;}
.search-top{display:flex;align-items:center;gap:6px;flex:0 0 auto;
            padding:calc(var(--safe-top) + 8px) 8px 8px;border-bottom:1px solid var(--line);}
#search-input{flex:1;min-width:0;border:0;outline:0;background:var(--surface);
              border-radius:20px;padding:11px 14px;min-height:44px;}
#search-input::placeholder{color:#5d7d87;}
#search-note{flex:0 0 auto;padding:10px 14px 4px;color:var(--muted);font-size:13px;}
#search-results{flex:1;overflow-y:auto;overscroll-behavior:contain;
                padding:4px 8px calc(12px + var(--kb) + var(--safe-bottom));}
.hit{display:block;width:100%;text-align:left;color:inherit;
     padding:10px 12px;margin-bottom:6px;border-radius:12px;background:var(--surface);}
.hit:active{background:var(--surface-2);}
.hit-who{display:flex;justify-content:space-between;gap:10px;
         font-size:12px;color:var(--muted);margin-bottom:3px;}
.hit-who b{color:var(--text);font-weight:600;}
.hit-text{font-size:14.5px;line-height:1.4;white-space:pre-wrap;
          word-wrap:break-word;overflow-wrap:anywhere;}
.hit-text mark{background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:0 1px;}
/* Where the jump landed. Without it you are returned to the thread at some
   arbitrary scroll position with nothing saying which bubble you came for. */
.bubble.found{outline:2px solid var(--accent);outline-offset:2px;}

/* ---------------- Viewer ---------------- */
#viewer{position:fixed;inset:0;background:#000;z-index:20;display:none;
        align-items:center;justify-content:center;touch-action:none;}
#viewer.on{display:flex;}
/* dvh rather than %, so a mobile toolbar sliding away actually gives the image
   the space. contain keeps it honest at any window shape. */
#viewer img,#viewer video{max-width:100vw;max-height:100dvh;object-fit:contain;}
#viewer .close{position:absolute;top:calc(var(--safe-top) + 8px);right:8px;font-size:22px;color:#fff;}

/* ---------------- Privacy blur ---------------- */
#privacy{position:fixed;inset:0;z-index:30;background:var(--bg);
         display:none;align-items:center;justify-content:center;}
#privacy.on{display:flex;}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + var(--safe-bottom));
       background:var(--surface-2);border:1px solid var(--line);color:var(--text);
       padding:9px 16px;border-radius:20px;font-size:14px;z-index:40;opacity:0;
       transition:opacity .2s;pointer-events:none;max-width:80vw;text-align:center;}
#toast.on{opacity:1;}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important;}
}

/* ---------------- Wide screens ----------------
   The thread was full-bleed at every width, so on a monitor one bubble sat hard
   against the left edge and the reply hard against the right, with the eye
   travelling the whole span between them — and a bubble at 78% of a very wide
   viewport is a line of text nobody can follow.

   Gutters rather than a max-width on a wrapper: the header, composer and their
   borders stay attached to the window, while the content inside them lines up in
   one readable column. */
@media (min-width: 900px){
  #hdr,#composer{padding-left:calc(50vw - 410px);padding-right:calc(50vw - 410px);}
  #scroller{padding-left:calc(50vw - 410px);padding-right:calc(50vw - 410px);}
  .search-top,#search-note,#search-results{
    padding-left:calc(50vw - 410px);padding-right:calc(50vw - 410px);}
  .banner{padding-left:calc(50vw - 410px);padding-right:calc(50vw - 410px);}
  /* A share of the column, not of the monitor. */
  .bubble{max-width:min(78%,560px);}
  /* #sheet was left0/right0 for a phone's edge-to-edge bottom sheet, which on
     a wide screen stretched every dialog it hosts — the PIN pad, the device
     list — clear across the monitor. Capped and centered, still rising from
     the bottom. */
  #sheet{left:50%;right:auto;width:min(480px,92vw);
         transform:translate(-50%,102%);border-radius:22px;}
  #sheet.on{transform:translate(-50%,0);}
}
</style>
</head>
<body>

<div id="app">

  <section id="lock" class="screen on">
    <div class="mark">
      <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <path d="M4 40c6-6 12-6 18 0s12 6 18 0 12-6 18 0" stroke="#38BFA7" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M4 52c6-6 12-6 18 0s12 6 18 0 12-6 18 0" stroke="#1b3b46" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="32" cy="20" r="7" stroke="#38BFA7" stroke-width="3.5"/>
      </svg>
      <!-- Dots are generated from PIN_LENGTH in app.js, so the two can never
           disagree about how many digits a PIN has. -->
      <div class="dots" id="dots"></div>
      <div id="lock-note"></div>
    </div>
    <div class="keypad" id="keypad"></div>
    <button id="lock-register" style="color:var(--muted);padding:10px;text-align:center;width:100%">New here? Create an account</button>
  </section>

  <section id="pending" class="screen">
    <div style="font-size:44px">🐚</div>
    <h2>Waiting to be let in</h2>
    <p id="pending-note">The other person needs to approve this device before anything appears here.</p>
    <button class="act" id="pending-retry" style="justify-content:center;color:var(--accent)">Enter my PIN again</button>
    <!-- Deliberately not .act: that class made this read as the same size,
         width and weight as the safe retry button above it — a full-width
         card sitting right where a thumb reaching for retry would land. A
         kill switch that erases the device and its history unrecoverably
         should look smaller than the button next to it, not equal to it. -->
    <button id="pending-signout" style="color:var(--muted);font-size:13px;padding:10px 12px">Start over on this device</button>
  </section>

  <section id="pool" class="screen">
    <header id="hdr">
      <div class="avatar" id="peer-avatar">🐟</div>
      <div class="who">
        <b id="peer-name">Reef</b>
        <span id="peer-state">connecting…</span>
      </div>
      <button class="tap" id="search-btn" aria-label="Search">🔍</button>
      <button class="tap" id="menu" aria-label="More">⋯</button>
    </header>

    <button class="banner" id="device-banner">
      <span>⏳</span>
      <span class="grow" id="device-banner-text"></span>
      <span class="go">Review</span>
    </button>

    <div id="scroller"><div id="list"></div></div>

    <div id="composer">
      <div id="new-pill-host" style="position:relative"></div>
      <div id="reply-strip">
        <span class="grow" id="reply-text"></span>
        <button class="tap" id="reply-cancel" aria-label="Cancel reply">✕</button>
      </div>
      <div id="peer-missing" style="display:none;align-items:center;gap:8px;margin:2px 4px 6px;
           padding:8px 10px;background:var(--surface);border-left:3px solid var(--danger);
           border-radius:8px;font-size:13px;color:var(--muted)">
        <span>🐚</span>
        <span class="grow" id="peer-missing-text">The other side has no approved device yet — nothing can be sent.</span>
      </div>
      <div id="edit-strip">
        <span class="grow" id="edit-note"></span>
        <button class="tap" id="edit-cancel" aria-label="Cancel edit">✕</button>
      </div>
      <!-- Stays after the search panel closes, so a result set can be walked
           through in the thread rather than one hit at a time. -->
      <div id="match-bar">
        <span class="grow" id="match-note"></span>
        <button class="tap" id="match-prev" aria-label="Older match">↑</button>
        <button class="tap" id="match-next" aria-label="Newer match">↓</button>
        <button class="tap" id="match-close" aria-label="Clear search">✕</button>
      </div>
      <!-- What is attached but not yet sent. Previously invisible: a toast, then
           nothing until it went. -->
      <div id="staged"></div>

      <!-- Replaces the input row while selecting, rather than sitting above it —
           composing a new message and picking old ones to erase read as two
           different modes, not two things to do at once. -->
      <div id="select-bar" style="display:none;align-items:center;gap:6px;padding:6px 4px">
        <button class="tap" id="select-cancel" aria-label="Cancel selection">✕</button>
        <span class="grow" id="select-count">0 selected</span>
        <button id="select-hide" style="color:var(--muted);font-weight:600;padding:8px 10px">Hide for me</button>
        <button id="select-delete" style="color:var(--danger);font-weight:600;padding:8px 10px">Delete for everyone</button>
      </div>

      <div class="inputrow" id="inputrow">
        <button class="tap" id="attach" aria-label="Attach">＋</button>
        <textarea id="text" rows="1" placeholder="Say something…"
                  enterkeyhint="send" autocomplete="off" autocorrect="on"></textarea>
        <button class="tap" id="emoji-btn" aria-label="Emoji">☺</button>
        <button id="send" aria-label="Send" disabled>➤</button>
      </div>
      <div id="emoji"></div>
      <!-- No accept filter: the server never sees a mime type, it is inside the
           encrypted descriptor, so there is nothing for it to object to. -->
      <input type="file" id="file-input" hidden multiple>
    </div>
  </section>

</div>

<!-- Search. Local by necessity, not by omission: the server stores ciphertext
     and holds no key, so there is nothing there to index. -->
<section id="search">
  <div class="search-top">
    <input id="search-input" type="search" placeholder="Search this conversation…"
           autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
    <button class="tap" id="search-close" aria-label="Close search">✕</button>
  </div>
  <div id="search-note"></div>
  <div id="search-results"></div>
</section>

<div id="scrim"></div>
<div id="sheet"></div>
<div id="viewer"><button class="close tap" id="viewer-close" aria-label="Close">✕</button></div>
<div id="privacy"><div style="font-size:40px;opacity:.5">🪸</div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="./crypto.js"></script>
<script src="./db.js"></script>
<script src="./api.js"></script>
<script src="./app.js"></script>
</body>
</html>
